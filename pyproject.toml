[project]
name = "matscout"
version = "0.1.0"
description = "MatScout-4090: local high-throughput AI-for-materials discovery pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [{ name = "MatScout" }]

# Light core dependencies: install fast, enable the full pipeline on fixtures.
dependencies = [
    "numpy>=1.26,<2.2",
    "pandas>=2.1",
    "pyarrow>=15",
    "duckdb>=0.10",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "pymatgen>=2024.5.1",
    "ase>=3.23",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "joblib>=1.3",
]

[project.optional-dependencies]
# Heavy ML potentials + GPU. Installed separately (Blackwell needs cu128 torch).
ml = [
    "chgnet>=0.3.8",
    "mace-torch>=0.3.6",
    "matgl>=1.1.2",
]
# Data-source / API integrations.
data = [
    "mp-api>=0.41",
    "matminer>=0.9",
]
# Extra analysis / dashboard.
extra = [
    "umap-learn>=0.5",
    "plotly>=5.20",
    "streamlit>=1.33",
    "xgboost>=2.0",
    "lightgbm>=4.3",
    "optuna>=3.6",
]
service = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "fastapi>=0.110",
    "httpx>=0.27",
]

[project.scripts]
matscout = "matscout.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/matscout"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501: long lines; B008: typer default calls; E702: intentional compact viz one-liners;
# B905: zip(strict=) not needed for equal-length paired lists; B007: intentional unused loop var.
ignore = ["E501", "B008", "E702", "B905", "B007"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
