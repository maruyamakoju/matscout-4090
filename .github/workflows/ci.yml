name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install (light core + dev)
        # Heavy ML deps (torch/chgnet/mace/matminer) are NOT installed in CI:
        # relaxation imports are lazy and the bandgap surrogate falls back to the
        # heuristic when matminer is absent, so the test suite runs CPU-only.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check src tests scripts

      - name: Mypy (type check)
        run: mypy

      - name: Pytest
        run: pytest -q
